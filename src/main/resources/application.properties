# -----------------------------
# BASE DE DATOS
# -----------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# HIBERNATE / JPA
# -----------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update      # Mantener update para seeders y tablas automáticas
spring.jpa.open-in-view=false

# -----------------------------
# HIKARI CONNECTION POOL
# -----------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=30000

# -----------------------------
# SERVER
# -----------------------------
server.port=${PORT:8080}   # Railway asigna automáticamente este puerto

